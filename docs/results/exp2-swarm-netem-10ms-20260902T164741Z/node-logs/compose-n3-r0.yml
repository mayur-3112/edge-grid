# GENERATED FILE - do not edit by hand.
#
#   python -m discovery.run_swarm --write-compose
#
# regenerates it, and tests/test_swarm.py::test_committed_compose_matches_generator
# fails if this file and discovery/run_swarm.py have drifted apart.
#
# 3 Edge Grid nodes, each in its own network namespace with its own
# address on the 10.77.0.0/24 bridge. Every node binds the same TCP port,
# which is the point: on shared loopback that is impossible.
#
# This example does not carry a bootstrap PeerID, because a PeerID cannot be
# known without a private key and no key is committed. Create the identities and
# print the address first:
#
#   python -m discovery.run_swarm --write-keys ./deploy/grid/keys --nodes 3
#   export EG_BOOTSTRAP="$(python -m discovery.run_swarm --print-bootstrap --nodes 3 \
#                            --key-dir ./deploy/grid/keys)"
#   docker compose -f deploy/grid/compose.yml up
#
# For measurements use discovery/run_swarm.py instead - it sequences the
# bootstrap ahead of the providers, collects each container's JSON event stream
# and writes a RunLog. `docker compose up` starts everything at once, and
# discovery.node does not retry its bootstrap dial.
name: "edgegrid-swarm-n3"
