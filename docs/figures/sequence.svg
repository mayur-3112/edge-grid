<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8324f"/>
    </marker>
  </defs>
  <rect width="1040" height="720" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#111">The Edge Grid — End-to-End Job Lifecycle</text>
  <text x="24" y="50" font-size="12" fill="#555">Eight steps from client request to settlement. Every message is signed; every arrow is a real code path.</text>

  <!-- lifelines -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="30"  y="70" width="128" height="34" fill="#f4f4f6" stroke="#333"/><text x="94"  y="92">Client / SDK</text>
    <rect x="196" y="70" width="150" height="34" fill="#f4f4f6" stroke="#333"/><text x="271" y="92">GossipSub mempool</text>
    <rect x="384" y="70" width="150" height="34" fill="#f4f4f6" stroke="#333"/><text x="459" y="92">Provider nodes</text>
    <rect x="572" y="70" width="128" height="34" fill="#f4f4f6" stroke="#333"/><text x="636" y="92">DA layer</text>
    <rect x="738" y="70" width="128" height="34" fill="#f4f4f6" stroke="#333"/><text x="802" y="92">Validator pool</text>
    <rect x="896" y="70" width="118" height="34" fill="#f4f4f6" stroke="#333"/><text x="955" y="92">Chain</text>
  </g>
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="3 4">
    <line x1="94"  y1="104" x2="94"  y2="672"/>
    <line x1="271" y1="104" x2="271" y2="672"/>
    <line x1="459" y1="104" x2="459" y2="672"/>
    <line x1="636" y1="104" x2="636" y2="672"/>
    <line x1="802" y1="104" x2="802" y2="672"/>
    <line x1="955" y1="104" x2="955" y2="672"/>
  </g>

  <g font-size="10.5" fill="#444">
    <!-- 1 escrow -->
    <text x="24" y="136" font-size="11" font-weight="bold" fill="#111">1</text>
    <path d="M94,142 L949,142" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="500" y="136" text-anchor="middle">openEscrow(job_id, provider=0x0, clearing_price) — funds locked before any work begins</text>

    <!-- 2 broadcast -->
    <text x="24" y="186" font-size="11" font-weight="bold" fill="#111">2</text>
    <path d="M94,192 L265,192" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="180" y="186" text-anchor="middle">publish JobRequest</text>
    <path d="M277,192 L453,192" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="365" y="186" text-anchor="middle">fan-out to eligible tier</text>

    <!-- 3 bids -->
    <text x="24" y="232" font-size="11" font-weight="bold" fill="#111">3</text>
    <path d="M453,238 L277,238" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="365" y="232" text-anchor="middle">sealed Bid (TTFT, price, warm)</text>
    <path d="M265,238 L100,238" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="182" y="232" text-anchor="middle">collect for bid window</text>

    <!-- 4 auction -->
    <text x="24" y="278" font-size="11" font-weight="bold" fill="#111">4</text>
    <rect x="60" y="282" width="200" height="30" fill="#fff" stroke="#333"/>
    <text x="160" y="301" text-anchor="middle" font-size="10.5">second-price auction</text>
    <path d="M94,340 L453,340" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="300" y="334" text-anchor="middle">JobAward — winner paid the runner-up's price</text>

    <!-- 5 inference -->
    <text x="24" y="360" font-size="11" font-weight="bold" fill="#111">5</text>
    <rect x="380" y="368" width="158" height="30" fill="#fff" stroke="#333"/>
    <text x="459" y="387" text-anchor="middle" font-size="10.5">Ollama streaming run</text>
    <path d="M453,412 L100,412" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="276" y="406" text-anchor="middle">token stream over direct P2P connection (TTFT measured at first token)</text>

    <!-- 6 commitment -->
    <text x="24" y="450" font-size="11" font-weight="bold" fill="#111">6</text>
    <path d="M465,456 L630,456" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="548" y="450" text-anchor="middle">submit output blob</text>
    <path d="M642,456 L949,456" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="796" y="450" text-anchor="middle">recordCommitment(sha256, blob_ref, merkle_root)</text>

    <!-- 7 verification -->
    <text x="24" y="496" font-size="11" font-weight="bold" fill="#111">7</text>
    <rect x="710" y="504" width="184" height="30" fill="#fff" stroke="#333"/>
    <text x="802" y="523" text-anchor="middle" font-size="10.5">sampled at 5% — audit or skip</text>
    <path d="M796,548 L642,548" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="719" y="542" text-anchor="middle">fetch blob, check Merkle proof</text>
    <rect x="700" y="560" width="204" height="30" fill="#fff" stroke="#333"/>
    <text x="802" y="579" text-anchor="middle" font-size="10.5">LLM-as-a-Judge → pass / fail / error</text>

    <!-- 8 settlement -->
    <text x="24" y="620" font-size="11" font-weight="bold" fill="#111">8</text>
    <path d="M802,626 L949,626" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#a)"/>
    <text x="876" y="620" text-anchor="middle">verdict</text>
    <path d="M949,652 L100,652" stroke="#a8324f" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ap)"/>
    <text x="520" y="646" text-anchor="middle" fill="#a8324f">pass → release escrow to provider after challenge window · fail → slash stake, 80% validator / 20% treasury</text>
  </g>
</svg>
