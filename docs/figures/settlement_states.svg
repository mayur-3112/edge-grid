<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8324f"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d7a63"/>
    </marker>
  </defs>
  <rect width="1040" height="560" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="bold" fill="#111">Escrow State Machine and Slashing</text>
  <text x="24" y="50" font-size="12" fill="#555">Enforced identically in <tspan font-family="monospace" font-size="11">Marketplace.sol</tspan> and <tspan font-family="monospace" font-size="11">edgegrid/ledger.py</tspan>. Value is conserved on every path.</text>

  <!-- states -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="40"  y="130" width="150" height="52" fill="#f4f4f6" stroke="#333" stroke-width="1.4"/>
    <text x="115" y="152" font-weight="bold" fill="#111">OPEN</text>
    <text x="115" y="170" font-size="10.5" fill="#666">funds locked</text>

    <rect x="300" y="130" width="190" height="52" fill="#f4f4f6" stroke="#333" stroke-width="1.4"/>
    <text x="395" y="152" font-weight="bold" fill="#111">AWAITING_VERIFICATION</text>
    <text x="395" y="170" font-size="10.5" fill="#666">challenge window open</text>

    <rect x="640" y="52" width="160" height="52" fill="#eef7f3" stroke="#1d7a63" stroke-width="1.4"/>
    <text x="720" y="74" font-weight="bold" fill="#0f5a48">SETTLED</text>
    <text x="720" y="92" font-size="10.5" fill="#3d7a6c">provider paid</text>

    <rect x="640" y="212" width="160" height="52" fill="#fbeef1" stroke="#a8324f" stroke-width="1.4"/>
    <text x="720" y="234" font-weight="bold" fill="#8c2740">SLASHED</text>
    <text x="720" y="252" font-size="10.5" fill="#a05068">stake redistributed</text>

    <rect x="640" y="320" width="160" height="52" fill="#f4f4f6" stroke="#333" stroke-width="1.4"/>
    <text x="720" y="342" font-weight="bold" fill="#111">REFUNDED</text>
    <text x="720" y="360" font-size="10.5" fill="#666">requester made whole</text>
  </g>

  <!-- transitions -->
  <g font-size="10.5" fill="#444">
    <path d="M190,156 L294,156" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="242" y="148" text-anchor="middle">commitment</text>
    <text x="242" y="172" text-anchor="middle" font-size="9.5" fill="#777">recorded on chain</text>

    <path d="M490,146 L560,146 L560,78 L634,78" stroke="#1d7a63" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
    <text x="566" y="112" fill="#1d7a63">window elapsed, no valid challenge</text>

    <path d="M490,166 L560,166 L560,238 L634,238" stroke="#a8324f" stroke-width="1.4" fill="none" marker-end="url(#ap)"/>
    <text x="566" y="196" fill="#a8324f">fraud proof accepted in window</text>

    <path d="M720,264 L720,314" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="730" y="292">escrow returned</text>

    <path d="M115,182 L115,340 L634,340" stroke="#1a1a1a" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
    <text x="128" y="334">provider never delivers — timeout refund</text>
  </g>

  <!-- the split -->
  <rect x="40" y="404" width="960" height="128" fill="#fbfbfc" stroke="#999"/>
  <text x="56" y="426" font-size="10.5" letter-spacing="1.4" fill="#666">SLASH DISTRIBUTION — 80 / 20, CAPPED AT REMAINING STAKE</text>
  <g font-size="11.5">
    <rect x="56" y="440" width="216" height="72" fill="#fff" stroke="#333"/>
    <text x="164" y="464" text-anchor="middle" fill="#111">slash_amount =</text>
    <text x="164" y="484" text-anchor="middle" font-family="monospace" font-size="11" fill="#111">min(escrow, stake)</text>
    <text x="164" y="499" text-anchor="middle" font-size="10" fill="#777">shortfall is recorded as</text>
    <text x="164" y="511" text-anchor="middle" font-size="10" fill="#777">fully_covered = false, never hidden</text>

    <path d="M272,476 L316,476" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="322" y="440" width="216" height="72" fill="#fff" stroke="#333"/>
    <text x="430" y="464" text-anchor="middle" fill="#111">80% → detecting validator</text>
    <text x="430" y="486" text-anchor="middle" font-size="10.5" fill="#666">pays for the audit, so auditing</text>
    <text x="430" y="502" text-anchor="middle" font-size="10.5" fill="#666">is individually rational</text>

    <rect x="560" y="440" width="216" height="72" fill="#fff" stroke="#333"/>
    <text x="668" y="464" text-anchor="middle" fill="#111">20% → DAO treasury</text>
    <text x="668" y="486" text-anchor="middle" font-size="10.5" fill="#666">funds the protocol, and stops</text>
    <text x="668" y="502" text-anchor="middle" font-size="10.5" fill="#666">self-reporting being profitable</text>

    <rect x="798" y="440" width="186" height="72" fill="#fff" stroke="#333"/>
    <text x="891" y="464" text-anchor="middle" fill="#111">requester refunded</text>
    <text x="891" y="486" text-anchor="middle" font-size="10.5" fill="#666">from the escrow, not</text>
    <text x="891" y="502" text-anchor="middle" font-size="10.5" fill="#666">from the slashed stake</text>
  </g>
</svg>
